# Minimal local-transformation prototype pipeline.
#
#   export OPENROUTER_API_KEY=...
#   uv run proctor run -c configs/c2rust_crat_local.toml \
#     --input-c <c-project>

[run]
provides = ["c_project", "rule_set"]

[llm]
provider = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-5.6-luna"
# model = "anthropic/claude-sonnet-5"

[llm.pricing."openai/openai/gpt-5.6-luna"]
input = 1.00
cached_input = 0.10
output = 6.00

[llm.pricing."openai/anthropic/claude-sonnet-5"]
input = 2.00
cached_input = 0.20
output = 10.00

[llm.extra]
reasoning_effort = "low"

[pipeline]
order = ["c2rust", "crat", "local_transformation"]

[stages.c2rust]
uses = "stages/c2rust-adapter"
timeout_s = 600

[stages.crat]
uses = "stages/crat-adapter"
timeout_s = 600

[stages.crat.config]
passes = [
  "expand",
  "extern",
  "preprocess",
  "enum",
  "simpl",
  "unsafe",
  "unexpand",
  "split",
  "bin",
]

[stages.local_transformation]
uses = "stages/local-transformation"
timeout_s = 3600

[stages.local_transformation.config]
dump_llm_exchanges = true
