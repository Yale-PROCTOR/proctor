# Corpus-scale bench WITHOUT vector verification: c2rust -> crat over a
# corpus suite, one run dir per case. A case is "ok" when both stages
# COMPLETE (translation succeeded) — not verified correct. For vector
# gating use configs/bench_vectors.toml (or ./bench.sh <suite>).
#
#   uv run proctor bench -c configs/bench.toml \
#     --corpus tractor-test-corpus/Test-Corpus/Public-Tests/B02_organic --jobs 16

[run]
provides = ["c_project"]

[testing]
after_each_stage = false

[bench]
jobs = 16

[bench.layout]
c_project = "."   # a corpus case root IS the C project (test_case/ inside)

[pipeline]
order = ["c2rust", "crat"]

[stages.c2rust]
uses = "stages/c2rust-adapter"
timeout_s = 600

[stages.crat]
uses = "stages/crat-adapter"
timeout_s = 600

[stages.crat.config]
passes = [
  "expand",
  "extern",
  "preprocess",
  "enum",
  "simpl",
  "unsafe",
  "unexpand",
  "split",
  "bin",
]
