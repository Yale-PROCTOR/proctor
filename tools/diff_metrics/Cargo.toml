[package]
name = "diff_metrics"
version = "0.1.0"
edition = "2021"

# Stage-neutral before/after diff of two crates: files and lines changed
# (rustfmt-normalized) and the exported-symbol ABI (signatures + reachable type
# layouts). See PROVENANCE.md.
#
# toml reads Cargo targets; the rest is parsing (syn, quote), the CLI and JSON.
[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
quote = "1.0.40"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
syn = { version = "2.0.101", features = ["full", "visit"] }
toml = "0.8"

[profile.release]
strip = true
