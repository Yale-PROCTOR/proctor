id = "local_transformation"
version = "0.1.0"
description = "Transform independent pointer-local SCCs concurrently with validated LLM output."

exec = ["python3", "main.py"]
warmup = ["python3", "main.py", "--build-only"]

[requires]
rust_project = "required"
rule_set = "optional"

[produces]
rust_project = true

[config]
workers = { type = "integer", default = 4, doc = "positive number of workers, each owning an SCC through generation, private compilation, repair, and observation extraction" }
crat_dir = { type = "string", default = "../crat", doc = "crat checkout, relative to this stage" }
dump_llm_exchanges = { type = "bool", default = false, doc = "persist each rendered prompt and LLM response under stage artifacts" }
